openapi: 3.2.0
info:
  title: Aegis Marine Shipmanagement Taxonomy Categories API
  description: 'Anonymous read access to the two content taxonomies on aegisships.com — one `category` term (`News`) and 25 `post_tag` terms. Every term reports `count: 0` because the site publishes no posts, so these terms are an empty classification scaffold rather than an active index.'
  version: wp-v2 (WordPress core REST API, as observed 2026-09-09)
  contact:
    name: Aegis Marine Shipmanagement
    email: info@aegisships.com
    url: https://aegisships.com/contact/
  x-generated-by: API Evangelist enrichment pipeline (local-v3)
  x-generated-from: live route index + observed responses at https://aegisships.com/wp-json/
  x-provenance:
    generated: '2026-09-09'
    method: derived
    source: https://aegisships.com/wp-json/ (live WordPress REST route index, fetched 2026-09-09)
    note: Derived from the site's own self-describing WordPress route index and from responses actually fetched anonymously. No operation, parameter or schema here was invented; the surface is WordPress core, not a product API authored by Aegis Marine Shipmanagement.
servers:
- url: https://aegisships.com/wp-json
  description: WordPress REST API root for aegisships.com
tags:
- name: Categories
paths:
  /wp/v2/categories:
    get:
      operationId: getCategories
      tags:
      - Categories
      summary: List categories
      description: Returns the hierarchical `category` terms. `X-WP-Total` read 1 when captured.
      parameters:
      - description: Scope of the returned content.
        schema:
          type: string
          enum:
          - view
          - embed
          default: view
        in: query
        name: context
        required: false
      - name: page
        in: query
        required: false
        description: Current page of the collection.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        description: Maximum number of items returned per page. The API rejects values above 100 with HTTP 400 `rest_invalid_param`.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: search
        in: query
        required: false
        description: Limit results to those matching a search string.
        schema:
          type: string
      - name: order
        in: query
        required: false
        description: Sort order.
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: slug
        in: query
        required: false
        description: Limit results to terms with specific slugs.
        schema:
          type: array
          items:
            type: string
      - name: parent
        in: query
        required: false
        description: Limit results to terms with a specific parent id.
        schema:
          type: integer
      - name: hide_empty
        in: query
        required: false
        description: Whether to hide terms not assigned to any object.
        schema:
          type: boolean
      responses:
        '200':
          description: A page of results. Total counts are returned in the `X-WP-Total` and `X-WP-TotalPages` response headers.
          headers:
            X-WP-Total:
              description: Total number of matching objects.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available.
              schema:
                type: integer
            Link:
              description: RFC 8288 `next`/`prev` pagination links.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
              - id: 60
                count: 0
                link: https://aegisships.com/category/news/
                name: News
                slug: news
                taxonomy: category
                parent: 0
        '400':
          description: '`rest_invalid_param` — a query parameter failed validation (observed on `per_page=200`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rest_invalid_param
                message: 'Invalid parameter(s): per_page'
                data:
                  status: 400
                  params:
                    per_page: per_page must be between 1 (inclusive) and 100 (inclusive)
  /wp/v2/categories/{id}:
    get:
      operationId: getCategory
      tags:
      - Categories
      summary: Retrieve a category
      description: Returns a single category term by numeric id.
      parameters:
      - name: id
        in: path
        required: true
        description: Unique numeric identifier for the object.
        schema:
          type: integer
      - description: Scope of the returned content.
        schema:
          type: string
          enum:
          - view
          - embed
          default: view
        in: query
        name: context
        required: false
      responses:
        '200':
          description: The requested object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              example:
                id: 60
                count: 0
                link: https://aegisships.com/category/news/
                name: News
                slug: news
                taxonomy: category
                parent: 0
        '404':
          description: '`rest_post_invalid_id` / `rest_no_route` — the object or route does not exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: rest_post_invalid_id
                message: Invalid post ID.
                data:
                  status: 404
components:
  schemas:
    Error:
      type: object
      description: WordPress REST API error envelope. Not RFC 9457 problem+json — it is served as `application/json` with a `code`/`message`/`data` shape.
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. `rest_post_invalid_id`.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code, repeated in the body.
            params:
              type: object
              additionalProperties:
                type: string
              description: Per-parameter validation messages, present on 400.
    Category:
      type: object
      description: A term in the hierarchical `category` taxonomy. One exists at capture (`News`).
      properties:
        id:
          type: integer
          description: Unique identifier for the term.
        count:
          type: integer
          description: Number of published objects assigned to the term. Every term on this site reads 0, because no posts are published.
        description:
          type: string
          description: HTML description of the term.
        link:
          type: string
          format: uri
          description: Public archive URL for the term.
        name:
          type: string
          description: Display name of the term.
        slug:
          type: string
          description: URL-safe identifier for the term.
        _links:
          type: object
          description: HAL-style `_links` relations emitted by the WordPress REST API.
          additionalProperties: true
        taxonomy:
          type: string
          const: category
          description: Taxonomy the term belongs to.
        parent:
          type: integer
          description: Identifier of the parent category, or 0. References `Category.id`.
