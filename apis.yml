aid: aegis-marine-shipmanagement
name: Aegis Marine Shipmanagement
description: >-
  Aegis Marine Shipmanagement Inc. is a privately owned marine vessel transportation and ship
  management company headquartered at 215 South Road and King Street, Lacytown, Georgetown, Guyana,
  with a secondary office in Brooklyn, New York. Founded in 2018 by Guyanese-American businessman
  Sean Clarke, it serves the oil and gas sector, operating crude oil tankers, liquefied natural gas
  tankers and offshore support service vessels on behalf of third-party owners, partners and
  investors. Its services span commercial, technical, safety and quality, and logistics ship
  management, delivered through partnerships with established marine service providers, and include
  vessel registration under various flags, technical inspection and marine engine spares, marine
  vessel chartering, commodity trader engagement, and crew management covering recruitment,
  familiarization, training, retention and career promotion. Aegis Marine Shipmanagement is a
  shipping operator rather than a software vendor. It publishes no developer portal, no API
  documentation, no SDKs and no commercial or partner-facing product API. The only machine-readable
  interface it exposes is the WordPress core REST content API behind its corporate website at
  aegisships.com, which is captured here for discovery purposes: it is anonymously readable,
  effectively read-only, and serves the marketing site's own pages, media and taxonomy rather than
  any fleet, chartering or vessel-operations data.
